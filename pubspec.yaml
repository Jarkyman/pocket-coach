name: pocket_coach
description: "Your personal AI pocket coach."
publish_to: 'none'

version: 1.0.2+5

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.1.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI / Design
  google_fonts: ^8.0.2
  gap: ^3.0.1
  flutter_animate: ^4.5.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Utils
  json_annotation: ^4.11.0
  uuid: ^4.5.3
  equatable: ^2.0.8
  dart_openai: ^6.1.1
  flutter_dotenv: ^6.0.0
  connectivity_plus: ^7.0.0
  purchases_flutter: ^9.12.2
  purchases_ui_flutter: ^9.12.2
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.11.1
  riverpod_generator: ^4.0.3
  json_serializable: ^6.13.0

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/coaches.json
    - assets/coaches/
    - .env

